# Jedi-3B-1080p（NeurIPS'25 spotlight，xlangai）—— SOTA 级 GUI 定位模型
#
# 为什么加这一档：我们的零样本基座是 80.0%，而 Jedi-3B 用 400 万样本训练到
# ScreenSpot-v2 88.6（论文值）。它是**标准 Qwen2.5-VL 架构的纯微调版**，
# 不需要改模型代码，可以直接用同一套 vLLM 框架服务 —— 正好用来验证
# 「换权重就能拿到 SOTA 级精度」这件事，以及后续量化它的损失。
#
# 路径同样走 ${MODEL_DIR}：
#   MODEL_DIR=/hy-tmp/models bash scripts/... 或 export MODEL_DIR=...
model: ${MODEL_DIR}/Jedi-3B-1080p
served_model_name: jedi-3b
dtype: bfloat16
quantization: null

# 与 bf16_base.yaml 保持完全一致，确保两档可比
max_model_len: 8192
gpu_memory_utilization: 0.90
limit_mm_per_prompt: '{"image":1,"video":0}'
enable_prefix_caching: false
enforce_eager: true   # 大图 + CUDA Graph 在本机会崩（同 AWQ 档位，见 error-log 第 27 条）

port: 8000
